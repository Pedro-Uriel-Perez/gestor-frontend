spring.application.name=Ejercicio5Cliente
# En Render el puerto llega en la variable PORT; en local se usa el 8080
server.port=${PORT:8080}
# URL de la API REST (en Render la pone Terraform con la URL pública del servicio gestor-api)
api.url=${API_URL:http://localhost:8081}

# Monitoreo (Actuator + Micrometer). Prometheus lee /actuator/prometheus; el histograma de
# http.server.requests permite calcular la latencia p95 con histogram_quantile.
# Semgrep (spring-actuator-dangerous-endpoints-enabled): solo se exponen health y prometheus;
# /actuator/prometheus exige el token de metricas.token (FiltroMetricas, pruebas COB-18 a COB-20).
# nosemgrep: java.spring.security.audit.spring-actuator-non-health-enabled.spring-actuator-dangerous-endpoints-enabled
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=gestor-frontend
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Token que Prometheus manda como "Authorization: Bearer ..." (Terraform lo genera y lo pone en Render).
# Vacío = métricas abiertas, solo para desarrollo local.
metricas.token=${METRICAS_TOKEN:}
